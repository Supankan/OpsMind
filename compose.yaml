services:
  postgres:
    image: postgres:16-alpine
    container_name: opsmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind_password
      POSTGRES_DB: opsmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind -d opsmind"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
